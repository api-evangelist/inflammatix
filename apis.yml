apis:
- aid: inflammatix:site-content
  name: Inflammatix Site Content API
  description: 'The public, anonymously-readable WordPress REST content API served
    by inflammatix.com. Alongside the standard WordPress collections (posts, pages,
    media, categories, tags, comments, search) it exposes the company''s own publication
    custom post type and its category-publication taxonomy — a machine-readable index
    of the peer-reviewed clinical evidence library behind TriVerity. Derived verbatim
    from the route-discovery document the site itself publishes at /wp-json/; read
    access verified live 2026-08-01. Write operations exist but require WordPress Application
    Password authentication.'
  humanURL: https://inflammatix.com/
  baseURL: https://inflammatix.com/wp-json/wp/v2
  tags:
  - Content
  - Publications
  - WordPress
  - Research
  properties:
  - type: OpenAPI
    url: openapi/inflammatix-content-openapi.yml
  - type: Overlay
    url: overlays/inflammatix-content-overlay.yaml
  - type: Examples
    url: examples/inflammatix-publication-list.json
- aid: inflammatix:support-content
  name: Inflammatix Support and Training Content API
  description: 'The public, anonymously-readable WordPress REST content API served
    by support.inflammatix.com, the Inflammatix customer support and TriVerity/Myrna
    operator-training portal. In addition to the standard WordPress collections it
    exposes the MemberPress Courses post types (mpcs-course, mpcs-lesson, mpcs-quiz)
    and their taxonomies, so the training catalogue is machine-readable even though
    lesson bodies sit behind the customer login. Derived verbatim from the route-discovery
    document published at /wp-json/; read access verified live 2026-08-01.'
  humanURL: https://support.inflammatix.com/
