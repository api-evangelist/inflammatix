aid: inflammatix
name: Inflammatix
description: 'Inflammatix is a molecular diagnostics company headquartered in Sunnyvale,
  California that reads the patient''s own immune response to speed up decisions in
  emergency and critical care. Its FDA-cleared TriVerity Test System measures a 29-mRNA
  host-response panel from whole blood on the benchtop Myrna instrument using RT-LAMP,
  returning three machine-learning-derived scores — bacterial infection likelihood,
  viral infection likelihood, and risk of severe illness within seven days — in about
  30 minutes, with under a minute of no-prep sample handling. The company was co-founded
  out of Stanford by Tim Sweeney and Purvesh Khatri, is backed by Khosla Ventures,
  Northpond Ventures, Think.Health Ventures, Iberis Capital, OSF HealthCare and Vesalius
  BioCapital plus federal funding from NIH, BARDA, DRIVe and DARPA, and holds ISO 13485:2016
  certification and a State of California medical device manufacturing license. Inflammatix
  publishes no developer API for its clinical products; the Myrna instrument advertises
  "multiple LIS connectivity options" and remote notification, but no public interface
  specification. The machine-readable surfaces it does serve are the WordPress REST
  content APIs behind inflammatix.com and its customer support/training portal, which
  expose the company''s peer-reviewed publication library and the TriVerity/Myrna course
  catalogue as JSON.'
